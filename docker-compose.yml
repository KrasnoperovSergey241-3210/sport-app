services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: sport
      POSTGRES_PASSWORD: sport_dev_password
      POSTGRES_DB: sport_main
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
  redis:
    image: redis:7
    ports: ["6379:6379"]
volumes:
  pgdata:
