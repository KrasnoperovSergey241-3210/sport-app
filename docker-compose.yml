services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:16}
    environment:
      POSTGRES_USER: sport
      POSTGRES_PASSWORD: sport_dev_password
      POSTGRES_DB: sport_main
    ports: ["127.0.0.1:${DB_PORT:-5433}:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "sport", "-d", "sport_main"]
      interval: 2s
      timeout: 3s
      retries: 20
  redis:
    image: ${REDIS_IMAGE:-redis:7}
    ports: ["127.0.0.1:6379:6379"]
volumes:
  pgdata:
